version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # VITE_* variables are injected by the Amplify branch (defined in the backend SAM template)
        - test -n "$VITE_USER_POOL_ID" && test -n "$VITE_API_URL" || (echo "Missing VITE_* environment variables" && exit 1)
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
